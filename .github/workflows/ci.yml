name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: esp-reset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: plan
        run: python3 tools/release_ci.py plan
  host-tests:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install pyserial==3.5
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_web.js
      - run: node tests/test_release.js
      - run: python3 -m py_compile tools/*.py
      - run: sh -n tools/espreset
      - run: git diff --check
  firmware:
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32s3
            board: esp32s3-n16r8
          - target: esp32c3
            board: esp32c3-supermini
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build and package firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build
          python3 tools/check_build.py build ${{ matrix.target }}
          python3 tools/package_firmware.py build dist/${{ matrix.board }}
          python3 tools/release_ci.py pack dist/${{ matrix.board }} dist/release ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: esp-reset-${{ matrix.board }}
          path: dist/release/*
          if-no-files-found: error
  release:
    # Never publish from PRs, feature branches, or unchanged versions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.publish == 'true'
    needs: [version, host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: esp-reset-*
          merge-multiple: true
          path: release-assets
      - run: python3 tools/release_ci.py checksums release-assets
      - uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: await require('./tools/publish_release.cjs')({github, context, core})
