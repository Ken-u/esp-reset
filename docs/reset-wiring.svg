<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240">
<style>text{font-family:system-ui,'Noto Sans SC',sans-serif;font-size:22px;fill:#20344b}.small{font-size:18px;fill:#536b82}.wire{fill:none;stroke:#20344b;stroke-width:4}.ctl{fill:none;stroke:#146bbd;stroke-width:4}.gnd{fill:none;stroke:#26785b;stroke-width:4}.blue{fill:#146bbd}.green{fill:#26785b}</style>
<rect width="1400" height="1240" fill="#f5f8fc"/>
<text x="35" y="48" font-size="32">ESP Reset 三路接线图：每路一套 MOSFET + 两个电阻</text>
<text x="35" y="88" class="small">适用于 RESET 按键一端接 GND；保留原按键。三路 RESET 信号互不连接，MOSFET 方案需要共地。</text>
<text x="35" y="121" class="small">S3：GPIO4 / 5 / 6　　C3：GPIO3 / 4 / 5（不使用 GPIO20 / 21）　　每路脉冲约 200 ms。</text>
<g transform="translate(0,155)">
<rect x="35" y="0" width="1330" height="262" rx="12" fill="white" stroke="#c9d6e4"/>
<text x="60" y="35">第 1 路</text><text x="60" y="84" class="blue">S3 GPIO4</text><text x="60" y="118" class="blue">C3 GPIO3</text>
<text x="60" y="151" class="small">两种板选其一</text><text x="60" y="224" class="green">ESP GND</text>
<path class="ctl" d="M230 110H325M405 110H655M490 110V149M655 70V153"/>
<rect x="325" y="99" width="80" height="22" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="320" y="76" class="blue">R1a 330 Ω</text>
<rect x="479" y="149" width="22" height="45" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="517" y="180" class="small">R1b 4.7 kΩ</text>
<path class="gnd" d="M490 194V219M230 219H1150M675 143H720V219M1150 170V219"/>
<path class="wire" d="M675 70V89M675 102V122M675 135V154M675 81H720V43H1150V92"/>
<text x="623" y="141" class="blue">G</text><text x="684" y="63">D</text><text x="680" y="181" class="green">S</text>
<circle cx="490" cy="110" r="5" fill="#146bbd"/><circle cx="490" cy="219" r="5" fill="#26785b"/><circle cx="720" cy="219" r="5" fill="#26785b"/>
<text x="770" y="115">Q1 2N7002</text><text x="770" y="151" class="small">1=G / 2=S / 3=D</text>
<text x="946" y="29" class="small">目标 1 RESET（A1）</text>
<circle cx="1150" cy="92" r="6" fill="white" stroke="#20344b" stroke-width="3"/><circle cx="1150" cy="170" r="6" fill="white" stroke="#20344b" stroke-width="3"/>
<path class="wire" d="M1150 170L1120 112"/>
<text x="1190" y="119" class="small">原按键 1</text><text x="1180" y="213" class="green">GND（B1）</text>
</g>
<g transform="translate(0,440)">
<rect x="35" y="0" width="1330" height="262" rx="12" fill="white" stroke="#c9d6e4"/>
<text x="60" y="35">第 2 路</text><text x="60" y="84" class="blue">S3 GPIO5</text><text x="60" y="118" class="blue">C3 GPIO4</text>
<text x="60" y="151" class="small">两种板选其一</text><text x="60" y="224" class="green">ESP GND</text>
<path class="ctl" d="M230 110H325M405 110H655M490 110V149M655 70V153"/>
<rect x="325" y="99" width="80" height="22" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="320" y="76" class="blue">R2a 330 Ω</text>
<rect x="479" y="149" width="22" height="45" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="517" y="180" class="small">R2b 4.7 kΩ</text>
<path class="gnd" d="M490 194V219M230 219H1150M675 143H720V219M1150 170V219"/>
<path class="wire" d="M675 70V89M675 102V122M675 135V154M675 81H720V43H1150V92"/>
<text x="623" y="141" class="blue">G</text><text x="684" y="63">D</text><text x="680" y="181" class="green">S</text>
<circle cx="490" cy="110" r="5" fill="#146bbd"/><circle cx="490" cy="219" r="5" fill="#26785b"/><circle cx="720" cy="219" r="5" fill="#26785b"/>
<text x="770" y="115">Q2 2N7002</text><text x="770" y="151" class="small">1=G / 2=S / 3=D</text>
<text x="946" y="29" class="small">目标 2 RESET（A2）</text>
<circle cx="1150" cy="92" r="6" fill="white" stroke="#20344b" stroke-width="3"/><circle cx="1150" cy="170" r="6" fill="white" stroke="#20344b" stroke-width="3"/>
<path class="wire" d="M1150 170L1120 112"/>
<text x="1190" y="119" class="small">原按键 2</text><text x="1180" y="213" class="green">GND（B2）</text>
</g>
<g transform="translate(0,725)">
<rect x="35" y="0" width="1330" height="262" rx="12" fill="white" stroke="#c9d6e4"/>
<text x="60" y="35">第 3 路</text><text x="60" y="84" class="blue">S3 GPIO6</text><text x="60" y="118" class="blue">C3 GPIO5</text>
<text x="60" y="151" class="small">两种板选其一</text><text x="60" y="224" class="green">ESP GND</text>
<path class="ctl" d="M230 110H325M405 110H655M490 110V149M655 70V153"/>
<rect x="325" y="99" width="80" height="22" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="320" y="76" class="blue">R3a 330 Ω</text>
<rect x="479" y="149" width="22" height="45" fill="white" stroke="#146bbd" stroke-width="3"/>
<text x="517" y="180" class="small">R3b 4.7 kΩ</text>
<path class="gnd" d="M490 194V219M230 219H1150M675 143H720V219M1150 170V219"/>
<path class="wire" d="M675 70V89M675 102V122M675 135V154M675 81H720V43H1150V92"/>
<text x="623" y="141" class="blue">G</text><text x="684" y="63">D</text><text x="680" y="181" class="green">S</text>
<circle cx="490" cy="110" r="5" fill="#146bbd"/><circle cx="490" cy="219" r="5" fill="#26785b"/><circle cx="720" cy="219" r="5" fill="#26785b"/>
<text x="770" y="115">Q3 2N7002</text><text x="770" y="151" class="small">1=G / 2=S / 3=D</text>
<text x="946" y="29" class="small">目标 3 RESET（A3）</text>
<circle cx="1150" cy="92" r="6" fill="white" stroke="#20344b" stroke-width="3"/><circle cx="1150" cy="170" r="6" fill="white" stroke="#20344b" stroke-width="3"/>
<path class="wire" d="M1150 170L1120 112"/>
<text x="1190" y="119" class="small">原按键 3</text><text x="1180" y="213" class="green">GND（B3）</text>
</g>
<text x="35" y="1060">2N7002 顶视：单脚朝上为 3=D；下方左 1=G、右 2=S。器件脚序以厂家手册为准。</text>
<text x="35" y="1105" class="small">用量：2N7002 ×3、330 Ω ×3、4.7 kΩ ×3。G / S / D 为简化符号；每路下拉不可省。</text>
<text x="35" y="1145" class="small">断电确认各按键 B 与目标 GND 导通；不要把 ESP 的 3V3 / 5V 接到任何 RESET 信号。</text>
<text x="35" y="1185" class="small">按键没有接地端或目标板不应共地时，改用三路独立、双向输出的隔离 PhotoMOS 干接点模块。</text>
</svg>