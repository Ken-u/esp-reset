<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
<rect width="1200" height="740" fill="#f5f8fc"/>
<style>text{font-family:system-ui,'Noto Sans SC',sans-serif;fill:#193047;font-size:23px}.small{font-size:18px;fill:#53687c}.blue{fill:#166ac4}.green{fill:#23785d}.wire{fill:none;stroke:#193047;stroke-width:4;stroke-linejoin:round}.gnd{fill:none;stroke:#23785d;stroke-width:4}.ctl{fill:none;stroke:#166ac4;stroke-width:4}</style>
<text x="35" y="48" font-size="31">ESP Reset：S3 / C3 控制接地型 RESET 按键</text>
<text x="35" y="88" class="small">前提：断电确认按键 B 接目标板 GND。保留原按键，Q1 并联在 A / B 之间。</text>
<rect x="35" y="130" width="1130" height="405" rx="15" fill="white" stroke="#cad6e4"/>
<rect x="65" y="185" width="210" height="290" rx="10" fill="#eaf3ff" stroke="#a7c9ec"/>
<text x="85" y="224" class="blue">ESP32 控制器</text>
<text x="85" y="265" class="small">S3-N16R8：GPIO4</text>
<text x="85" y="295" class="small">C3：GPIO20</text>
<text x="111" y="330" class="blue">输出 GPIO</text>
<text x="168" y="443" class="green">GND</text>
<path class="ctl" d="M275 325H350M425 325H600M470 325V365"/>
<rect x="350" y="314" width="75" height="22" fill="white" stroke="#166ac4" stroke-width="3"/>
<text x="343" y="290" class="blue">330 Ω</text>
<rect x="459" y="365" width="22" height="55" fill="white" stroke="#166ac4" stroke-width="3"/>
<path class="gnd" d="M470 420V445M275 445H1010"/>
<text x="492" y="402" class="blue">4.7 kΩ</text>
<circle cx="470" cy="325" r="5" fill="#166ac4"/><circle cx="470" cy="445" r="5" fill="#23785d"/>
<path class="ctl" d="M600 282V370"/>
<path class="wire" d="M620 282V302M620 316V337M620 351V371M620 293H660V195H1010V270"/>
<path class="gnd" d="M620 360H660V445M1010 355V445"/>
<text x="570" y="350" class="blue">G</text><text x="630" y="254">D</text><text x="630" y="399" class="green">S</text>
<text x="707" y="315">Q1 2N7002</text><text x="707" y="349" class="small">G=1 / S=2 / D=3</text>
<text x="740" y="171">RESET 信号 A</text><text x="1040" y="205">A</text><text x="1040" y="448" class="green">B</text>
<circle cx="1010" cy="270" r="6" fill="white" stroke="#193047" stroke-width="3"/><circle cx="1010" cy="355" r="6" fill="white" stroke="#193047" stroke-width="3"/>
<path class="wire" d="M1010 355L975 294"/><text x="1040" y="302" class="small">原有</text><text x="1040" y="328" class="small">按键</text>
<circle cx="660" cy="445" r="5" fill="#23785d"/><path class="gnd" d="M660 445V465M640 465H680M647 475H673M655 485H665"/>
<text x="340" y="513" class="small">ESP GND、Q1 的 S、目标板 GND 必须共地。</text>
<text x="35" y="581">2N7002 顶视：单脚朝上为 3=D；下方左 1=G、右 2=S。</text>
<text x="35" y="624" class="small">GPIO 空闲低，触发高约 200 ms。外部 4.7 kΩ 下拉不能省；图为 MOSFET 简化符号。</text>
<text x="35" y="660" class="small">S3 不要接 GPIO20（USB）。不要把 ESP 的 3V3 / 5V 接到目标 RESET。</text>
<text x="35" y="696" class="small">如果按键没有接地端，改用双向隔离 PhotoMOS 干接点模块；不能直接套用此图。</text>
</svg>
